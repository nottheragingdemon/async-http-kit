[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asynchttp"
version = "0.2.0"
description = "A tiny async HTTP kit (standard library only) for running many requests in parallel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["asynchttp"]
